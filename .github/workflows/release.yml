name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          export VERSION="${VERSION#v}"
          ./scripts/build-app.sh
          ditto -c -k --keepParent build/YAXray.app "YAXray-${VERSION}-macos.zip"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" YAXray-*-macos.zip --clobber
